server:
  port: 8080

spring:
  application:
    name: code-review-hub
  datasource:
    # 内嵌 H2 文件数据库，数据保存在 ./data 目录，无需外部数据库
    url: jdbc:h2:file:./data/review-hub;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

# 评审引擎配置（修改后需重启生效）
review:
  # 异步评审工作线程数（并发评审数）
  workers: 2

logging:
  level:
    com.reviewhub: INFO
